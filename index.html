<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Montopan Teklif Hazırlama</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:12px;background:#0f172a;color:#f1f5f9;font-family:Segoe UI,Arial,sans-serif}
#app{max-width:1200px;margin:auto}.header,.card{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:12px;margin-bottom:10px}
.header{display:flex;align-items:center;gap:15px}
.header h1{margin:0;color:#38bdf8;font-size:20px}
.logo-box{width:110px;height:55px;border:1px dashed #475569;border-radius:6px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;background:#0f172a;color:#94a3b8;font-size:10px;text-align:center;flex-shrink:0}
.logo-box img{width:100%;height:100%;object-fit:contain}
.form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
label{display:block;font-size:10px;color:#94a3b8;margin-bottom:2px}
input{width:100%;padding:6px;background:#0f172a;border:1px solid #475569;border-radius:6px;color:#fff;font-size:12px}
.card h2{font-size:14px;margin:0 0 10px;color:#cbd5e1}
.actions{display:flex;gap:7px;margin-top:10px}
button{border:0;border-radius:6px;padding:8px 12px;color:#fff;cursor:pointer;font-weight:700;font-size:11px}
.btn-blue{background:#0284c7}.btn-green{background:#16a34a}.btn-dark{background:#334155}.btn-red{background:#dc2626}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border-bottom:1px solid #334155;padding:8px;text-align:left;font-size:11px}
th{color:#38bdf8;background:#0f172a}
.thumb{width:180px;height:130px;object-fit:cover;border-radius:6px;border:1px solid #475569;background:#0f172a;display:block}
.totals-wrap{text-align:right;margin-top:15px;font-size:13px;color:#cbd5e1;line-height:1.6}
.total-grand{font-size:18px;font-weight:800;color:#38bdf8;margin-top:4px}

@media print {
  @page { size: landscape; margin: 10mm; }
  body{background:#fff;color:#000;padding:0}
  #app{max-width:100%;margin:0}
  .header,.card{background:#fff;border:none;padding:5px;margin-bottom:5px}
  input{border:none;background:transparent;color:#000;padding:0}
  .actions, button, th:last-child, td:last-child {display:none !important}
  table {width:100%; font-size:10px;}
  th, td {padding:4px; border-bottom:1px solid #ccc;}
  th {color:#000; background:#eee !important;}
  .thumb{width:100px;height:75px;border:1px solid #ccc}
}
</style>
</head>
<body>
<div id="app">
<div class="header">
  <div class="logo-box" id="logoBox" onclick="$('logoFile').click()">Logo Seç</div>
  <input id="logoFile" type="file" accept="image/*" style="display:none" onchange="loadLogo(this)">
  <div><h1>Montopan Teklif Hazırlama</h1></div>
</div>

<!-- Firma Bilgileri -->
<div class="card"><h2>Teklif Veren Firma Bilgileri</h2>
<div class="form-grid">
<div><label>Firma Adı</label><input id="myCompany" oninput="saveLocal()"></div>
<div><label>Firma İletişim (Tel)</label><input id="myPhone" oninput="saveLocal()"></div>
<div><label>Web Adresi</label><input id="myWeb" oninput="saveLocal()"></div>
<div><label>Firma Adres</label><input id="myAddress" oninput="saveLocal()"></div>
</div></div>

<!-- Müşteri Bilgileri -->
<div class="card"><h2>Müşteri Bilgileri</h2>
<div class="form-grid">
<div><label>Müşteri Adı</label><input id="customer" oninput="saveLocal()"></div>
<div><label>Firma Adı</label><input id="customerCompany" oninput="saveLocal()"></div>
<div><label>Müşteri Tel</label><input id="phone" oninput="saveLocal()"></div>
<div><label>Teklif No</label><input id="offerNo" oninput="saveLocal()"></div>
<div><label>Adres</label><input id="customerAddress" oninput="saveLocal()"></div>
<div><label>Tarih</label><input type="date" id="offerDate" oninput="saveLocal()"></div>
<div><label>Bitiş Tarihi</label><input type="date" id="expiryDate" oninput="saveLocal()"></div>
<div><label>KDV Oranı (%)</label><input type="number" id="vatRate" value="20" oninput="calculateTotals();saveLocal()"></div>
</div></div>

<div class="card">
<div class="actions">
<button class="btn-blue" onclick="document.getElementById('modelFile').click()">📁 Model Seç</button>
<input id="modelFile" type="file" accept="image/*" multiple style="display:none">
<button class="btn-green" onclick="makePDF()">📄 PDF Kaydet</button>
<button class="btn-green" onclick="sendWhatsApp()">🟢 WhatsApp</button>
<button class="btn-dark" onclick="clearAll()">↻ Temizle</button>
</div>
<div class="table-wrap"><table>
<thead><tr><th>Model Görseli</th><th>Kod</th><th>Ölçü</th><th>Adet</th><th>m²</th><th>Fiyat/m²</th><th>Toplam</th><th>Sil</th></tr></thead>
<tbody id="modelRows"></tbody></table></div>
<div class="totals-wrap">
  <div>Ara Toplam (KDV Hariç): <span id="subTotal">0,00 ₺</span></div>
  <div>KDV Tutar (<span id="vatLabel">%20</span>): <span id="vatTotal">0,00 ₺</span></div>
  <div class="total-grand">Genel Toplam (KDV Dahil): <span id="grandTotal">0,00 ₺</span></div>
</div>
</div>
</div>

<script>
let models=[]; let logoData=''; const $=id=>document.getElementById(id);

function loadLogo(input){
  if(input.files && input.files[0]){
    const reader=new FileReader();
    reader.onload=e=>{
      logoData=e.target.result;
      $('logoBox').innerHTML=`<img src="${logoData}">`;
      saveLocal();
    }
    reader.readAsDataURL(input.files[0]);
  }
}

function saveLocal(){
  const data={
    myCompany:$('myCompany').value, myPhone:$('myPhone').value, myWeb:$('myWeb').value, myAddress:$('myAddress').value,
    customer:$('customer').value, customerCompany:$('customerCompany').value, phone:$('phone').value, offerNo:$('offerNo').value,
    customerAddress:$('customerAddress').value, offerDate:$('offerDate').value, expiryDate:$('expiryDate').value,
    vatRate:$('vatRate').value, logo:logoData, models: models
  };
  localStorage.setItem('montopan_settings',JSON.stringify(data));
}

function loadLocal(){
  const saved=localStorage.getItem('montopan_settings');
  if(saved){
    const d=JSON.parse(saved);
    $('myCompany').value=d.myCompany||''; $('myPhone').value=d.myPhone||'';
    $('myWeb').value=d.myWeb||''; $('myAddress').value=d.myAddress||'';
    $('customer').value=d.customer||''; $('customerCompany').value=d.customerCompany||'';
    $('phone').value=d.phone||''; $('offerNo').value=d.offerNo||'';
    $('customerAddress').value=d.customerAddress||''; $('offerDate').value=d.offerDate||''; $('expiryDate').value=d.expiryDate||'';
    if(d.vatRate)$('vatRate').value=d.vatRate;
    
    if(d.logo && d.logo.startsWith('data:image')){
      logoData=d.logo;
      $('logoBox').innerHTML=`<img src="${logoData}">`;
    } else {
      logoData='';
      $('logoBox').innerHTML='Logo Seç';
    }

    if(d.models && Array.isArray(d.models)){
      models = d.models;
    }
  } else {
    $('logoBox').innerHTML='Logo Seç';
  }
}

$('modelFile').addEventListener('change',e=>{[...e.target.files].forEach(readFile);e.target.value=''});
function readFile(file){const r=new FileReader();r.onload=e=>{models.push({image:e.target.result,code:'',size:'',qty:'',sqm:'',price:''});render();saveLocal();};r.readAsDataURL(file)}

function updateRow(i, field, val) {
  models[i][field] = val;
  const row = document.querySelectorAll('#modelRows tr')[i];
  if(row) {
    const sqm = parseFloat(models[i].sqm) || 0;
    const price = parseFloat(models[i].price) || 0;
    const rowTotal = sqm * price;
    const totalCell = row.querySelector('.row-total');
    if(totalCell) {
      totalCell.textContent = rowTotal.toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' ₺';
    }
  }
  calculateTotals();
  saveLocal();
}

function calculateTotals(){
  const sub = models.reduce((a,m)=>a+((parseFloat(m.price)||0)*(parseFloat(m.sqm)||0)),0);
  const vatRate = parseFloat($('vatRate').value)||0;
  const vat = sub * (vatRate / 100);
  const grand = sub + vat;

  $('subTotal').textContent = sub.toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₺';
  $('vatLabel').textContent = '%' + vatRate;
  $('vatTotal').textContent = vat.toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₺';
  $('grandTotal').textContent = grand.toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₺';
  return {sub, vat, grand};
}

function render(){
  const t=$('modelRows'); t.innerHTML='';
  models.forEach((m,i)=>{
    const rowTotal = (parseFloat(m.price)||0)*(parseFloat(m.sqm)||0);
    const tr=document.createElement('tr');
    tr.innerHTML=`<td>${m.image?'<img class="thumb" src="'+m.image+'">':'<div class="thumb" style="display:flex;align-items:center;justify-content:center;color:#64748b;font-size:11px;">Görsel Yok</div>'}</td>
    <td><input style="width:220px" value="${m.code}" oninput="updateRow(${i}, 'code', this.value)" placeholder="Model kodu..."></td>
    <td><input style="width:100px" value="${m.size}" oninput="updateRow(${i}, 'size', this.value)" placeholder="Ölçü..."></td>
    <td><input style="width:60px" type="number" value="${m.qty}" oninput="updateRow(${i}, 'qty', this.value)"></td>
    <td><input style="width:70px" type="number" value="${m.sqm}" oninput="updateRow(${i}, 'sqm', this.value)"></td>
    <td><input style="width:80px" type="number" value="${m.price}" oninput="updateRow(${i}, 'price', this.value)"></td>
    <td><strong class="row-total">${rowTotal.toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})} ₺</strong></td>
    <td><button class="btn-red" onclick="models.splice(${i},1);render();saveLocal();" title="Bu satırı sil">✕</button></td>`;
    t.appendChild(tr);
  });
  calculateTotals();
}

function makePDF(){
  window.print();
}

function sendWhatsApp(){
  const phone = $('phone').value.trim();
  if(!phone){
    alert('Lütfen müşteri telefon numarasını girin!');
    $('phone').focus();
    return;
  }
  const customerName = $('customer').value || 'Sayın Müşterimiz';
  const offerNo = $('offerNo').value || '-';
  
  let msg = `*${offerNo} Nolu Fiyat Teklifi*\nSayın ${customerName},\n\nTeklif detaylarınız aşağıdadır:\n`;
  models.forEach((m, idx)=>{
    const rTot = ((parseFloat(m.price)||0)*(parseFloat(m.sqm)||0)).toFixed(2);
    msg += `\n${idx+1}. Model Kod: ${m.code || '-'}\n   Ölçü: ${m.size || '-'} | m²: ${m.sqm || 0} | Tutar: ${rTot} ₺`;
  });
  
  msg += `\n\n*Genel Toplam (KDV Dahil): ${$('grandTotal').textContent}*\n\nBizi tercih ettiğiniz için teşekkür ederiz.`;
  
  let cleanPhone = phone.replace(/\D/g,'');
  if(cleanPhone.startsWith('0')) cleanPhone = '9' + cleanPhone;
  else if(!cleanPhone.startsWith('90')) cleanPhone = '90' + cleanPhone;
  
  window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}`, '_blank');
}

function clearAll(){
  if(confirm('Tüm bilgiler, logo ve eklenen modeller silinsin mi?')){
    localStorage.removeItem('montopan_settings');
    location.reload();
  }
}

loadLocal(); render();
</script>
</body>
</html>
